baseURL = "https://sherlock.kristoferhallen.com/"
locale = "en-us"
title = "Kristofer's Sherlock Holmes library"
theme = "PaperMod"

[params]
  env = "production"
  description = "Sherlock Holmes book reviews"
  images = ["/sherlocksiluett.jpg"]
  author = "Kristofer"
  # customCSS = ["css/extended_custom.css"]

  [params.homeInfoParams]
    Title = "Welcome to Kristofer's Sherlock Holmes Library"
    Content = "A collection of reviews of Sherlock Holmes pastiches, novels, and stories featuring the world's greatest detective."

  [params.footer]
    text = "[RSS feed](/index.xml)"

  [params.label]
    icon = "/sherlocksiluett.jpg"
    iconHeight = 45

  
# /llms.txt (https://llmstxt.org/), generated from layouts/index.llms.txt
[outputFormats.llms]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "RSS", "llms"]

[taxonomies]
  author = "authors"
  tag = "tags"
  series = "series"

# Main menu. `sections` lists the content sections where an item is shown
# as the current page (see layouts/partials/header.html).
[[menu.main]]
  name = "Books"
  url = "/books/"
  weight = 1
  [menu.main.params]
    sections = ["books", "top-books", "tags", "posts"]

[[menu.main]]
  name = "Series"
  url = "/guides/"
  weight = 2
  [menu.main.params]
    sections = ["guides", "series"]

[[menu.main]]
  name = "Sherlock Meets"
  url = "/sherlock-meets/"
  weight = 3
  [menu.main.params]
    sections = ["sherlock-meets"]

[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 4
  [menu.main.params]
    sections = ["about"]

[imaging]
  # Image processing quality
  quality = 85
  
  # Anchor for cropping (smart, center, topleft, etc)
  anchor = "smart"
  
  # Default background color for transparency
  bgColor = "#ffffff"
  
  # JPEG and WebP quality
  [imaging.exif]
    disableDate = false
    disableLatLong = true